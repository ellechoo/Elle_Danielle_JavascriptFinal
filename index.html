<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>

    <!-- Face API + your script -->
    <script defer src="face-api.min.js"></script>
    <script defer src="script.js"></script>

    <!-- Chart.js for the graph -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

    <link rel="stylesheet" href="style.css">
</head>


    <!-- WEBCAM FEED and Emotion Graph -->

    <body>

        <div class="page-header">
            <img src="images/InterFACE.png" class="header-icon" alt="icon">
            <span class="header-title">InterFACE Tracker</span>
        </div>



        <div class="right-nav">
            <a href="#video">Video Feed</a>
            <a href="#emotionChart">Live Data</a>
            <a href="#emotionSummaryChart">Summary</a>
        </div>



        <div class="main-wrapper">

            <video id="video" width="640" height="480" autoplay muted></video>

            <div style="width: 640px;">
                <canvas id="emotionChart"></canvas>
            </div>

            <div style="width: 640px; margin-top: 40px;">
                <canvas id="emotionSummaryChart"></canvas>
            </div>

        </div>
    </body>



    <!-- LISTENER FOR EXTENSION DATA + GRAPH LOGIC -->
    <script>
        // Set up a Chart.js line graph
        const ctx = document.getElementById("emotionChart").getContext("2d");

        const emotionChart = new Chart(ctx, {
            type: "line",
            data: {
                labels: [], // timestamps
                datasets: [
                    {
                        label: "Happy",
                        data: [],
                        borderWidth: 2
                    },
                    {
                        label: "Neutral",
                        data: [],
                        borderWidth: 2
                    },
                    {
                        label: "Sad",
                        data: [],
                        borderWidth: 2
                    },
                    {
                        label: "Angry",
                        data: [],
                        borderWidth: 2
                    },
                    {
                        label: "Surprised",
                        data: [],
                        borderWidth: 2
                    },
                    {
                        label: "Disgusted",
                        data: [],
                        borderWidth: 2
                    },
                    {
                        label: "Fearful",
                        data: [],
                        borderWidth: 2
                    }

                ]
            },
            options: {
                responsive: true,
                animation: false,
                scales: {
                    y: { min: 0, max: 1 }
                }
            }
        });





        // --- 60-second summary chart data ---
        let emotionTotals = {
            happy: 0,
            neutral: 0,
            sad: 0,
            angry: 0,
            surprised: 0,
            disgusted: 0,
            fearful: 0
        };

        // --- create the 60-sec summary chart ---
        const ctx2 = document.getElementById("emotionSummaryChart").getContext("2d");

        const emotionSummaryChart = new Chart(ctx2, {
            type: "bar",
            data: {
                labels: ["Happy", "Neutral", "Sad", "Angry", "Surprised", "Disgusted", "Fearful"],
                datasets: [{
                    label: "Emotion Totals (every 60s)",
                    data: [0, 0, 0, 0, 0, 0, 0],
                    borderWidth: 2
                }]
            },
            options: {
                responsive: true,
                animation: false,
                scales: {
                    y: { beginAtZero: true }
                }
            }
        });





        // Receive extension data
        
        window.addEventListener("message", (event) => {
            if (event.data.type !== "FACE_DETECTIONS") return;

            const faces = event.data.payload;  // <-- FIXED

            if (!faces || !faces.length) return;

            const exp = faces[0].expressions; 
            const t = new Date().toLocaleTimeString();

            // push data into the chart
            emotionChart.data.labels.push(t);
            emotionChart.data.datasets[0].data.push(exp.happy);
            emotionChart.data.datasets[1].data.push(exp.neutral);
            emotionChart.data.datasets[2].data.push(exp.sad);
            emotionChart.data.datasets[3].data.push(exp.angry);
            emotionChart.data.datasets[4].data.push(exp.surprised);
            emotionChart.data.datasets[5].data.push(exp.disgusted);
            emotionChart.data.datasets[6].data.push(exp.fearful);



            // add to 60-second totals
            emotionTotals.happy     += exp.happy;
            emotionTotals.neutral   += exp.neutral;
            emotionTotals.sad       += exp.sad;
            emotionTotals.angry     += exp.angry;
            emotionTotals.surprised += exp.surprised;
            emotionTotals.disgusted += exp.disgusted;
            emotionTotals.fearful   += exp.fearful;



            // limit graph to last 30 points
            const maxPoints = 30;
            emotionChart.data.labels = emotionChart.data.labels.slice(-maxPoints);
            emotionChart.data.datasets.forEach(ds => {
                ds.data = ds.data.slice(-maxPoints);
            });

            emotionChart.update();
        });



        // Update the 60-second summary chart every minute
        setInterval(() => {

        // update bar chart
        emotionSummaryChart.data.datasets[0].data = [
            emotionTotals.happy,
            emotionTotals.neutral,
            emotionTotals.sad,
            emotionTotals.angry,
            emotionTotals.surprised,
            emotionTotals.disgusted,
            emotionTotals.fearful
        ];

        emotionSummaryChart.update();

        // reset totals for next 60 sec
        emotionTotals = {
            happy: 0,
            neutral: 0,
            sad: 0,
            angry: 0,
            surprised: 0,
            disgusted: 0,
            fearful: 0
        };

    }, 60000);


    </script>


</html>
